<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Audins</title>
    <meta name="description" content="Audins - Audio Insight. Intelligent speech-to-text transcription, interactive acoustic waveform player, and executive AI summarization powered by Groq Whisper & LPU." />
    <!-- Anti-FOUC: apply the saved theme before first paint. -->
    <script>
      ;(function () {
        try {
          var t = localStorage.getItem("audin_theme")
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"
          }
          var root = document.documentElement
          root.classList.add(t)
          root.classList.remove(t === "dark" ? "light" : "dark")
        } catch (e) {}
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-background text-fg antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
